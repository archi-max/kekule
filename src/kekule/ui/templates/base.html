<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kekule{% endblock %} - Benchmark Dashboard</title>
    <style>
        :root {
            --bg: #0d1117;
            --bg-card: #161b22;
            --bg-hover: #1c2333;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --green: #3fb950;
            --green-bg: #0d2818;
            --red: #f85149;
            --red-bg: #2d1214;
            --blue: #58a6ff;
            --yellow: #d29922;
            --purple: #bc8cff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        a { color: var(--blue); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .navbar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .navbar-brand {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
        }
        .navbar a { color: var(--text-muted); font-size: 14px; }
        .navbar a:hover, .navbar a.active { color: var(--text); text-decoration: none; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        h1 { font-size: 24px; margin-bottom: 16px; }
        h2 { font-size: 20px; margin-bottom: 12px; }
        h3 { font-size: 16px; margin-bottom: 8px; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .card:hover { border-color: var(--text-muted); }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-pass { background: var(--green-bg); color: var(--green); }
        .badge-fail { background: var(--red-bg); color: var(--red); }

        .progress-bar {
            height: 8px;
            border-radius: 4px;
            background: var(--red);
            overflow: hidden;
            margin: 8px 0;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--green);
            border-radius: 4px;
        }

        .meta { color: var(--text-muted); font-size: 13px; }
        .meta span { margin-right: 16px; }

        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
        }
        th {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
        }
        tr:hover td { background: var(--bg-hover); }

        .expandable-toggle {
            cursor: pointer;
            user-select: none;
        }
        .expandable-toggle::before {
            content: '\25B6';
            display: inline-block;
            margin-right: 8px;
            transition: transform 0.2s;
            font-size: 10px;
        }
        .expandable-toggle.open::before {
            transform: rotate(90deg);
        }
        .expandable-content {
            display: none;
            padding: 12px 0 12px 24px;
        }
        .expandable-content.open { display: block; }

        .test-list {
            font-size: 13px;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }
        .test-list li {
            list-style: none;
            padding: 2px 0;
        }
        .test-list li::before {
            margin-right: 6px;
        }
        .test-list li.pass::before { content: '\2713'; color: var(--green); }
        .test-list li.fail::before { content: '\2717'; color: var(--red); }

        .chat-log { margin-top: 16px; }
        .chat-msg {
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 14px;
        }
        .chat-msg.assistant {
            background: #1a2332;
            border-left: 3px solid var(--blue);
        }
        .chat-msg.tool-result {
            background: #1a1e2a;
            border-left: 3px solid var(--purple);
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
        .chat-msg .tool-name {
            color: var(--yellow);
            font-weight: 600;
            font-size: 12px;
        }
        .chat-msg pre {
            white-space: pre-wrap;
            word-break: break-all;
            margin: 4px 0 0 0;
            font-size: 12px;
        }

        .btn {
            display: inline-block;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-card);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
        }
        .btn:hover { background: var(--bg-hover); border-color: var(--text-muted); }

        .summary-box {
            background: #1a2332;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px 16px;
            margin-top: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .breadcrumb {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }
        .breadcrumb a { color: var(--text-muted); }
        .breadcrumb a:hover { color: var(--text); }
        .breadcrumb .sep { margin: 0 6px; }

        .status-resolved { color: var(--green); }
        .status-failed { color: var(--red); }

        .loading {
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <span class="navbar-brand">Kekule</span>
        <a href="/benchmarks" class="{% if active_nav == 'benchmarks' %}active{% endif %}">Benchmarks</a>
        <a href="/experiments" class="{% if active_nav == 'experiments' %}active{% endif %}">Experiments</a>
        <a href="/api/health">API</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
