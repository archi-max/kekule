[project]
name = "kekule"
version = "0.1.0"
description = "A hybrid swarm orchestrator for coordinating multiple Claude agents on complex software engineering tasks"
readme = "README.md"
authors = [
    { name = "Ansh Tulsyan", email = "atulsyan850@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "aiofiles>=24.1.0",
    "aiohttp>=3.9.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
benchmarks = [
    "datasets>=2.14.0",
    "langfuse>=2.0.0",
    "swebench>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "mypy>=1.8.0",
]
all = [
    "kekule[benchmarks,dev]",
]

[project.scripts]
kekule-bench = "kekule.benchmarks.harness:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
